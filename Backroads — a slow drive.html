<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backroads — a slow drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --hedge: #2f4a32;
  --wheat: #e6cf95;
  --tarmac: #1b1e20;
  --mist: #c9d6de;
  --amber: #f2b35b;
  --ink: #f4f0e4;
  --dim: rgba(244, 240, 228, 0.66);
  --faint: rgba(244, 240, 228, 0.18);
  --scrim: rgba(12, 16, 13, 0.82);
  --sheet: rgba(17, 21, 19, 0.94);
  --font-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --scrim: rgba(10, 13, 11, 0.84); --sheet: rgba(14, 18, 16, 0.95); } }
:root[data-theme="dark"] { --scrim: rgba(10, 13, 11, 0.84); --sheet: rgba(14, 18, 16, 0.95); }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; overflow: hidden; background: #0d110f; color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 120% 95% at 50% 42%, transparent 58%, rgba(0, 0, 0, 0.34) 100%); }
#fade { position: fixed; inset: 0; background: #050605; opacity: 1; pointer-events: none; transition: opacity 0.65s ease; }
#fade.clear { opacity: 0; }

/* loading */
.loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: #0b0e0c; transition: opacity 0.8s ease 0.2s, visibility 0s linear 1s; z-index: 5; }
.loading.done { opacity: 0; visibility: hidden; }
.load-title { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(44px, 8vw, 84px); letter-spacing: -0.02em; color: var(--wheat); font-variation-settings: "opsz" 144; }
#loadText { margin: 0; color: var(--dim); font-size: 17px; }
.bar { width: min(280px, 60vw); height: 2px; background: var(--faint); margin: 8px auto 0; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--amber); transform-origin: left; transform: scaleX(0.03); transition: transform 0.25s ease; }

/* menu */
.menu[hidden] { display: none; }
.menu { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.menu-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, var(--scrim) 0%, rgba(10, 13, 11, 0.55) 34%, transparent 62%); }
.menu-card { position: absolute; left: clamp(22px, 6vw, 88px); bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(28px, 9vh, 96px)); max-width: 30rem; pointer-events: auto; }
.title { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(64px, 11vw, 136px); line-height: 0.86; letter-spacing: -0.035em; color: var(--wheat); font-variation-settings: "opsz" 144; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.35); }
.tagline { margin: 18px 0 30px; font-size: clamp(17px, 2vw, 19px); line-height: 1.5; color: var(--dim); max-width: 27ch; }
.menu-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.menu-btn { position: relative; background: none; border: 0; color: var(--ink); font: 600 clamp(20px, 2.4vw, 24px)/1.2 var(--font-ui); padding: 9px 0 9px 0; cursor: pointer; transition: padding-left 0.18s ease, color 0.18s ease; }
.menu-btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 0; height: 2px; background: var(--amber); transition: width 0.18s ease; }
.menu-btn:hover, .menu-btn:focus-visible { padding-left: 28px; color: #fff; outline: none; }
.menu-btn:hover::before, .menu-btn:focus-visible::before { width: 18px; }
.menu-btn.primary { color: var(--amber); }
.ledger { display: flex; gap: clamp(18px, 3vw, 34px); margin: 30px 0 0; padding-top: 18px; border-top: 1px solid var(--faint); }
.ledger div { min-width: 0; }
.ledger dt { font: 500 14px/1.2 "Barlow Condensed", var(--font-ui); color: var(--dim); letter-spacing: 0.02em; }
.ledger dd { margin: 4px 0 0; font: 600 18px/1.2 var(--font-ui); white-space: nowrap; }

/* sheet */
.sheet[hidden] { display: none; }
.sheet { position: absolute; top: env(safe-area-inset-top, 0px); right: 0; bottom: env(safe-area-inset-bottom, 0px); width: min(560px, 100%); background: var(--sheet); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: auto; display: flex; flex-direction: column; border-left: 1px solid var(--faint); }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 22px 26px 12px; }
.sheet h2 { margin: 0; font: 400 34px/1 var(--font-display); color: var(--wheat); letter-spacing: -0.01em; }
.sheet-close { background: none; border: 1px solid var(--faint); color: var(--ink); font: 600 16px var(--font-ui); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.sheet-close:focus-visible, .tab:focus-visible, .seg-btn:focus-visible, .switch:focus-visible, .act:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#sheetBody { overflow-y: auto; padding: 4px 26px 30px; user-select: text; -webkit-user-select: text; touch-action: pan-y; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.tab { background: none; border: 0; color: var(--dim); font: 600 16px var(--font-ui); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
.row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
.row-label { font: 500 17px var(--font-ui); }
.row-ctl { display: flex; align-items: center; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; color: var(--dim); font: 500 15px var(--font-ui); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.seg-btn[aria-pressed="true"] { color: #141714; background: var(--amber); }
input[type=range] { flex: 1; accent-color: var(--amber); }
output { min-width: 4ch; text-align: right; font: 600 15px var(--font-ui); color: var(--dim); }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 0; background: rgba(255, 255, 255, 0.16); position: relative; cursor: pointer; }
.switch span { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s ease; }
.switch[aria-checked="true"] { background: var(--amber); }
.switch[aria-checked="true"] span { transform: translateX(22px); }
.act { background: none; border: 1px solid rgba(255, 120, 100, 0.6); color: #ffb1a3; font: 600 15px var(--font-ui); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.help-lead { font-size: 17px; line-height: 1.6; color: var(--dim); max-width: 60ch; }
.keys { margin: 18px 0; }
.keys div { display: grid; grid-template-columns: minmax(9rem, 12rem) 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
.keys dt { font: 600 15px "Barlow Condensed", var(--font-ui); color: var(--wheat); letter-spacing: 0.02em; }
.keys dd { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); }

/* save slots */
.slots { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.slot { padding: 16px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); }
.slot.is-active { border-color: rgba(242, 179, 91, 0.55); background: rgba(242, 179, 91, 0.06); }
.slot-head { display: flex; align-items: baseline; gap: 12px; }
.slot h3 { margin: 0; font: 400 24px/1.1 var(--font-display); color: var(--wheat); }
.slot-tag { font: 600 13px "Barlow Condensed", var(--font-ui); color: var(--amber); letter-spacing: 0.03em; }
.slot-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin: 12px 0 0; }
.slot-stats dt { font: 500 13px "Barlow Condensed", var(--font-ui); color: var(--dim); letter-spacing: 0.02em; }
.slot-stats dd { margin: 2px 0 0; font: 600 16px var(--font-ui); }
.slot-time { margin: 10px 0 0; font-size: 15px; color: var(--dim); }
.slot-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--ink); font: 600 15px var(--font-ui); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.pill.primary { background: var(--amber); border-color: var(--amber); color: #141714; }
.pill.danger { color: #ffb1a3; border-color: rgba(255, 120, 100, 0.45); background: none; }
.pill:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* touch pedals */
.pedals[hidden] { display: none; }
.pedals { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: flex-end; gap: 14px; z-index: 2; }
.pedal { border-radius: 14px; background: repeating-linear-gradient(0deg, rgba(30, 32, 34, 0.55) 0 6px, rgba(70, 74, 78, 0.55) 6px 9px); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); touch-action: none; transition: transform 0.08s ease, background-color 0.08s; }
.pedal.brake { width: 92px; height: 74px; }
.pedal.gas { width: 58px; height: 122px; }
.pedal.down { transform: scale(0.94) translateY(3px); border-color: rgba(242, 179, 91, 0.8); }
@media (prefers-reduced-motion: reduce) { .menu-btn, .menu-btn::before, #fade, .loading { transition: none; } }
@media (max-width: 640px) {
  .menu-scrim { background: linear-gradient(0deg, var(--scrim) 0%, rgba(10, 13, 11, 0.5) 50%, transparent 78%); }
  .ledger { flex-wrap: wrap; }
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Driving view"></canvas>
<div class="vignette"></div>
<div id="menu" class="menu" hidden>
  <div class="menu-scrim"></div>
  <section class="menu-card" aria-label="Main menu">
    <h1 class="title">Backroads</h1>
    <p class="tagline">A slow drive through farmland and villages. Every kilometre pays — save up for something nicer.</p>
    <nav class="menu-actions">
      <button id="btnDrive" class="menu-btn primary">Start driving</button>
      <button id="btnSlots" class="menu-btn">Save slots</button>
      <button id="btnSettings" class="menu-btn">Settings</button>
      <button id="btnHelp" class="menu-btn">How to drive</button>
    </nav>
    <dl class="ledger">
      <div><dt>Wallet</dt><dd id="ledMoney">$0</dd></div>
      <div><dt>Car</dt><dd id="ledCar">Brisa 1.4</dd></div>
      <div><dt>Driven</dt><dd id="ledOdo">0 km</dd></div>
      <div><dt>Slot</dt><dd id="ledSlot">1</dd></div>
    </dl>
  </section>
  <aside id="sheet" class="sheet" hidden aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle">Settings</h2><button id="sheetClose" class="sheet-close">Done</button></header>
    <div id="sheetBody"></div>
  </aside>
</div>
<div id="pedals" class="pedals" hidden>
  <div id="pedBrake" class="pedal brake" role="button" aria-label="Brake"></div>
  <div id="pedGas" class="pedal gas" role="button" aria-label="Accelerate"></div>
</div>
<div id="loading" class="loading"><p class="load-title">Backroads</p><p id="loadText">Laying the road through the fields…</p><div class="bar"><span id="loadBar"></span></div></div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   Backroads — utilities
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const seedOf = (a, b) => (hash2(a, b) * 4294967296) | 0;

function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function fbm(x, y, oct) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }

}
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash2(i, 7919), hash2(i + 1, 7919), u) * 2 - 1;
}

function fmtMoney(n) { return '$' + Math.floor(Math.max(0, n)).toLocaleString('en-US'); }
function fmtKm(m) { return (m / 1000).toFixed(m < 10000 ? 1 : 0); }

function srgb(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function linArr(hex) { const c = srgb(hex); return [c.r, c.g, c.b]; }

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
let MAX_ANISO = 4;
function canvasTex(c, o = {}) {
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.encoding = THREE.sRGBEncoding;
  if (o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = o.aniso || Math.min(4, MAX_ANISO);
  if (o.mip === false) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
  return t;
}

/* Merge geometries (non-indexed) with optional transform matrix and flat vertex color */
function mergeGeos(list) {
  let total = 0;
  const parts = [];
  for (const it of list) {
    let g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    if (it.matrix) g.applyMatrix4(it.matrix);
    parts.push({ g, color: it.color });
    total += g.attributes.position.count;
  }
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o = 0;
  for (const p of parts) {
    const a = p.g.attributes, n = a.position.count;
    pos.set(a.position.array, o * 3);
    if (a.normal) nor.set(a.normal.array, o * 3);
    if (a.uv) uv.set(a.uv.array, o * 2);
    if (p.color) { for (let i = 0; i < n; i++) { col[(o + i) * 3] = p.color[0]; col[(o + i) * 3 + 1] = p.color[1]; col[(o + i) * 3 + 2] = p.color[2]; } }
    else if (a.color) col.set(a.color.array, o * 3);
    else col.fill(1, o * 3, (o + n) * 3);
    o += n;
    p.g.dispose();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.computeBoundingSphere();

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
function trs(x, y, z, rx, ry, rz, sx = 1, sy = 1, sz = 1, order = 'XYZ') {
  _e.set(rx, ry, rz, order); _q.setFromEuler(_e);
  return new THREE.Matrix4().compose(_v3.set(x, y, z), _q, _s3.set(sx, sy, sz));
}
/* Matrix placing a unit box (local z = length axis) between two points */
const _zAxis = new THREE.Vector3(0, 0, 1), _dir = new THREE.Vector3();
function segMatrix(ax, ay, az, bx, by, bz, w, h) {
  _dir.set(bx - ax, by - ay, bz - az);
  const len = _dir.length() || 0.001;
  _dir.multiplyScalar(1 / len);
  _q.setFromUnitVectors(_zAxis, _dir);
  return new THREE.Matrix4().compose(_v3.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2), _q, _s3.set(w, h, len));
}

/* Canvas helpers */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function hexCss(hex) { return '#' + hex.toString(16).padStart(6, '0'); }
/* =========================================================
   Save system — 3 slots, autosave, cloud sync
   ========================================================= */
const IS_TOUCH = !!((window.matchMedia && matchMedia('(pointer: coarse)').matches) || (('ontouchstart' in window) && navigator.maxTouchPoints > 0));
const LEGACY_KEY = 'backroads.save.v1';
const STORE_KEY = 'backroads.store.v2';
const SLOT_COUNT = 3;
const DEFAULT_SETTINGS = {
  quality: IS_TOUCH ? 1 : 2, viewDist: IS_TOUCH ? 0 : 1, fov: 62, mirror: !IS_TOUCH,
  time: 3, weather: 1, units: 0,
  master: 80, music: 65, engine: 70, ambience: 70,
  trans: 0, assist: 0, steerSens: 100, lookSens: 100, shake: true, lookReturn: true, autosave: true,
};
function freshProgress() {
  return { money: 0, owned: ['brisa'], car: 'brisa', paints: {}, odo: 0, best: 0, play: 0, pos: null, t: 0, created: Date.now() };
}
function normalizeProgress(d) {
  if (!d || typeof d !== 'object') return null;
  const o = Object.assign(freshProgress(), d);
  delete o.settings; delete o.v;
  if (!Array.isArray(o.owned) || !o.owned.length) o.owned = ['brisa'];
  if (!o.owned.includes('brisa')) o.owned.unshift('brisa');
  ['money', 'odo', 'best', 'play', 't', 'created'].forEach(k => { if (typeof o[k] !== 'number' || !isFinite(o[k])) o[k] = 0; });
  if (!o.paints || typeof o.paints !== 'object') o.paints = {};
  if (!o.owned.includes(o.car)) o.car = 'brisa';

  return o;
}
function normalizeStore(st) {
  st = (st && typeof st === 'object') ? st : {};
  const slots = Array.isArray(st.slots) ? st.slots : [];
  const del = Array.isArray(st.deleted) ? st.deleted : [];
  return {
    v: 2,
    settings: Object.assign({}, DEFAULT_SETTINGS, (st.settings && typeof st.settings === 'object') ? st.settings : {}),
    active: Math.min(SLOT_COUNT - 1, Math.max(0, st.active | 0)),
    slots: Array.from({ length: SLOT_COUNT }, (_, i) => normalizeProgress(slots[i])),
    deleted: Array.from({ length: SLOT_COUNT }, (_, i) => +del[i] || 0),
    settingsT: +st.settingsT || 0, savedAt: +st.savedAt || 0,

}

const Save = {
  store: normalizeStore(null), data: freshProgress(), lastSaved: -1e9, lastKind: '',
  remote: { db: null, uid: null, writing: false, pending: false, timer: 0 },
  onReplaced: null,
  get s() { return this.store.settings; },
  get active() { return this.store.active; },
  load() {
    let st = null;
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) st = JSON.parse(raw); } catch (e) { st = null; }
    if (!st) {
      try { const old = localStorage.getItem(LEGACY_KEY); if (old) { const o = JSON.parse(old); st = { settings: o.settings, active: 0, slots: [o, null, null] }; } } catch (e) { }
    }
    this.store = normalizeStore(st);
    this.data = this.store.slots[this.store.active] || freshProgress();
  },
  slot(i) { return this.store.slots[i]; },
  hasProgress(i) { return !!this.store.slots[i]; },
  writeLocal() {
    this.store.savedAt = Date.now();

  },
  openSheet(kind) {
    this.kind = kind; this.sheet.hidden = false;
    document.getElementById('sheetTitle').textContent = kind === 'help' ? 'How to drive' : kind === 'slots' ? 'Save slots' : 'Settings';
    this.slotConfirm = null;
    if (kind === 'help') this.renderHelp(); else if (kind === 'slots') this.renderSlots(); else this.renderSettings();
    document.getElementById('sheetClose').focus({ preventScroll: true });
  },
  closeSheet() { if (this.sheet) this.sheet.hidden = true; },
  renderHelp() {
    const rows = [
      ['W A S D or arrow keys', 'Accelerate, brake and steer. Hold brake when stopped to reverse.'],
      ['Click and drag', 'Look around the cabin. Click dashboard buttons and the screen.'],
      ['Esc', 'Settings, shown on the dashboard screen'],
      ['B', 'Car dealer, also on the dashboard (SHOP button)'],
      ['C', 'Cruise control at the current speed'],
      ['M  ·  N  ·  − / =', 'Play or pause music, next track, music volume'],
      ['L  ·  H  ·  Z', 'Headlights, horn, hazard lights'],
      ['Space  ·  R', 'Handbrake, put the car back on the road'],
      ['Q / E', 'Change gear when the gearbox is set to manual'],
    ];
    this.body.innerHTML = `<p class="help-lead">You earn money for every kilometre you drive on the road. Stay on the tarmac and keep moving, and a steady-drive bonus slowly climbs to ×2 over eight minutes. Stopping for long, leaving the road or bumping into things resets it.</p>
      <dl class="keys">${rows.map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>
      <p class="help-lead">On a phone or tablet: drag on the left part of the screen to steer, hold the right pedal to go and the left pedal to brake. Tap the dashboard buttons for music, the shop and settings.</p>`;
  },
  renderSlots() {
    const act = Save.active, mph = Save.s.units === 1, c = this.slotConfirm;
    let html = '<p class="help-lead">Your drive saves itself every 30 seconds, whenever you buy a car, and when you park. Each slot keeps its own money, cars and spot on the road.</p><ul class="slots">';
    for (let i = 0; i < SLOT_COUNT; i++) {
      const s = Save.slot(i);
      html += `<li class="slot${i === act ? ' is-active' : ''}"><div class="slot-head"><h3>Slot ${i + 1}</h3>${i === act ? '<span class="slot-tag">Last played</span>' : ''}</div>`;
      if (s) {
        const car = carById(s.car);
        html += `<dl class="slot-stats"><div><dt>Car</dt><dd>${car.name}</dd></div><div><dt>Wallet</dt><dd>${fmtMoney(s.money)}</dd></div><div><dt>Driven</dt><dd>${Math.floor(s.odo / 1000 * (mph ? 0.621 : 1)).toLocaleString('en-US')}${mph ? ' mi' : ' km'}</dd></div><div><dt>Played</dt><dd>${fmtPlay(s.play)}</dd></div></dl>`;
        html += `<p class="slot-time">Saved ${timeAgo(s.t)}</p>`;
        html += `<div class="slot-actions"><button class="pill primary" data-play="${i}">Play</button><button class="pill" data-over="${i}">${c === 'over' + i ? 'Tap again to start over' : 'Start over'}</button><button class="pill danger" data-del="${i}">${c === 'del' + i ? 'Tap again to delete' : 'Delete'}</button></div>`;
      } else {
        html += `<p class="slot-time">Empty</p><div class="slot-actions"><button class="pill primary" data-new="${i}">New game</button></div>`;
      }
      html += '</li>';
    }
    this.body.innerHTML = html + '</ul>';
    const q = (sel, fn) => this.body.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
    q('[data-play]', b => Game.playSlot(+b.dataset.play, false));
    q('[data-new]', b => Game.playSlot(+b.dataset.new, true));
    q('[data-over]', b => { const k = 'over' + b.dataset.over; if (this.slotConfirm !== k) { this.slotConfirm = k; this.renderSlots(); return; } this.slotConfirm = null; Game.playSlot(+b.dataset.over, true); });
    q('[data-del]', b => { const k = 'del' + b.dataset.del; if (this.slotConfirm !== k) { this.slotConfirm = k; this.renderSlots(); return; } this.slotConfirm = null; Save.deleteSlot(+b.dataset.del); this.refresh(); this.renderSlots(); });
  },
  renderSettings() {
    const s = Save.s;
    const tabs = SETTING_TABS;
    let html = `<div class="tabs" role="tablist">${tabs.map((t, i) => `<button role="tab" class="tab" aria-selected="${i === this.tab}" data-tab="${i}">${t}</button>`).join('')}</div><div class="rows">`;
    SETTINGS_SCHEMA.filter(it => it.tab === tabs[this.tab] && !it.driveOnly).forEach(it => {
      html += `<div class="row"><span class="row-label">${it.label}</span><div class="row-ctl">`;
      if (it.type === 'choice') html += `<div class="seg">${it.opts.map((o, i) => `<button class="seg-btn" aria-pressed="${s[it.key] === i}" data-k="${it.key}" data-v="${i}">${o}</button>`).join('')}</div>`;
      else if (it.type === 'range') html += `<input type="range" min="${it.min}" max="${it.max}" step="${it.step}" value="${s[it.key]}" data-k="${it.key}" aria-label="${it.label}"><output>${s[it.key]}${it.unit}</output>`;
      else if (it.type === 'toggle') html += `<button class="switch" role="switch" aria-checked="${!!s[it.key]}" data-k="${it.key}" aria-label="${it.label}"><span></span></button>`;
      else if (it.type === 'action') html += `<button class="act" data-act="${it.key}">${this.confirmReset ? 'Tap again to start over' : it.btn}</button>`;
      html += `</div></div>`;
    });
    html += `</div>`;
    this.body.innerHTML = html;
    this.body.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { this.tab = +b.dataset.tab; this.confirmReset = false; this.renderSettings(); });
    this.body.querySelectorAll('.seg-btn').forEach(b => b.onclick = () => changeSetting(b.dataset.k, +b.dataset.v));
    this.body.querySelectorAll('input[type=range]').forEach(r => { r.oninput = () => { r.nextElementSibling.textContent = r.value + (SETTINGS_SCHEMA.find(i => i.key === r.dataset.k).unit); }; r.onchange = () => changeSetting(r.dataset.k, +r.value); });
    this.body.querySelectorAll('.switch').forEach(b => b.onclick = () => changeSetting(b.dataset.k, !Save.s[b.dataset.k]));
    this.body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      if (!this.confirmReset) { this.confirmReset = true; this.renderSettings(); return; }
      this.confirmReset = false; Game.resetProgress(); this.renderSettings();
    });
  },
};

/* ---------------- boot ---------------- */
let lastT = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(); const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try { Game.update(dt, now); } catch (err) { console.error(err); }
}
async function boot() {
  Save.load();
  try {
    const faces = ['400 20px Barlow', '500 20px Barlow', '600 20px Barlow', '700 20px Barlow', '500 20px "Barlow Condensed"', '600 20px "Barlow Condensed"', '700 20px "Barlow Condensed"', '300 20px Fraunces', '600 20px Fraunces'];
    await Promise.race([Promise.all(faces.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { }
  buildTextures();
  World.init();
  World.mats.road.polygonOffset = true; World.mats.road.polygonOffsetFactor = -2; World.mats.road.polygonOffsetUnits = -2;
  World.mats.gravel.polygonOffset = true; World.mats.gravel.polygonOffsetFactor = -1; World.mats.gravel.polygonOffsetUnits = -1;
  Sky.init(); Trees.init(); Grass.init(); Screen.init(); Veh.init();
  Sky.registerEnv(World.mats.water, 1.0); Sky.registerEnv(World.mats.winDark, 0.8); Sky.registerEnv(World.mats.road, 0.15);
  Road.init(); Road.extendFwd(500); Road.extendBwd(300);
  if (TIME_HOURS[Save.s.time] === null) Sky.hour = 16.5;
  Game.applyAll();
  Sky.apply(true);
  Veh.setCar(carById(Save.data.car));
  Menu.init();
  if (Save.data.pos) { Road.ensureIndex(Save.data.pos.i); Game.menuS = Save.data.pos.i - 40; }
  Save.onReplaced = () => {
    Game.applyAll(); Menu.refresh();
    if (Game.state === 'drive' && Veh.def.id !== Save.data.car) Game.switchCar(Save.data.car, true);
  };
  Save.initRemote();
  resize();
  requestAnimationFrame(frame);
}
boot();

</script>
</body>
</html>
